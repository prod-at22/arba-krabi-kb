<style>
/* =========================================================================
   ARBA DESTINATION KB — SHARED STYLE (DO NOT EDIT PER DESTINATION)

:root{
  color-scheme: light;
  --ink:#1c1c1c; --muted:#6b6b6b; --line:#e6e6e6; --bg:#ffffff; --soft:#f7f7f7;
  --green:#c8172b; --green2:#e23744; --greend:#a01223; --greensoft:#fdebed;
  --halal:#0a7d63; --star:#c8172b;
  --sea1:#0e5c53; --sea2:#0a7d63;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 3px 12px rgba(0,0,0,.05);
  --shadow-lg:0 10px 30px rgba(0,0,0,.11);
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-padding-top:112px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Poppins","Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Arial,sans-serif;
  font-size:15px;line-height:1.5}
a{color:var(--green)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 90px}
.topbar{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}
.topbar .in{max-width:1080px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:16px}
.logo{white-space:nowrap;display:flex;align-items:center;gap:12px;text-decoration:none}
.brandmark{display:inline-flex;flex-direction:column;align-items:center;line-height:.85;color:var(--green);font-weight:800}
.brandmark>.big{font-size:24px;letter-spacing:.5px}
.brandmark>.sub{font-size:8px;letter-spacing:5px;font-weight:700;margin-top:3px}
.kbtag{font-size:12.5px;color:var(--muted);font-weight:700;border-left:1px solid var(--line);padding-left:12px}
.miniS{flex:1;max-width:520px;margin-left:auto;position:relative}
.miniS input{width:100%;padding:10px 14px 10px 40px;border:1px solid #d9d9d9;border-radius:999px;font-size:14px;outline:none;background:#fff}
.miniS input:focus{border-color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.miniS .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.hero{position:relative;border-radius:24px;overflow:hidden;margin-top:22px;min-height:340px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow)}
.hero .bg{position:absolute;inset:0;background:linear-gradient(135deg,var(--sea1),var(--sea2))}
.hero .bg img{width:100%;height:100%;object-fit:cover;display:block}

.hero .in{position:relative;color:#fff;padding:46px 22px;width:100%;max-width:640px}
.kicker{font-size:11.5px;letter-spacing:3px;font-weight:800;text-transform:uppercase;opacity:.9;margin-bottom:14px}
.hero h1{margin:0 0 10px;font-size:44px;font-weight:800;letter-spacing:-1.5px;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.hero .lead{font-size:15.5px;opacity:.95;margin:0 auto 24px;max-width:500px;font-weight:400;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.bigsearch{position:relative;background:#fff;border-radius:999px;box-shadow:0 10px 34px rgba(0,0,0,.24);display:flex;align-items:center;padding:6px 6px 6px 20px;max-width:560px;margin:0 auto}

.topicbar{position:sticky;top:53px;z-index:40;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:20px;padding:2px 0}
.topicbar::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;color:#3d3d3d;padding:13px 15px;white-space:nowrap;transition:.12s}
.tab:hover{color:var(--green)}

button.tcard{font:inherit;text-align:left;width:100%;cursor:pointer}

.tcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.16s}

.heart{position:absolute;right:10px;top:10px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);
  border:none;cursor:pointer;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2);color:#333}
.heart.on{color:#e0245e}
.tcard .body{padding:13px 14px 15px}

.tcard:hover .cta{background:var(--ink);color:#fff}
section.block{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

.status{font-size:12.5px;color:var(--muted);margin:12px 0;display:flex;align-items:center;gap:7px}

ul.klist li:last-child{border-bottom:none}
ul.klist li:before{content:"\2713";position:absolute;left:2px;top:7px;color:var(--green);font-weight:800}
table.kb{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}

details.qa summary .tw{color:var(--green);transition:.15s;flex:0 0 auto;margin-top:1px;font-size:12px}
details.qa[open] summary .tw{transform:rotate(90deg)}
.ans{padding:2px 16px 15px 42px;font-size:14px;color:#333}
.ans p{margin:6px 0}.ans strong{color:var(--ink)}
.ans ul,.ans ol{margin:6px 0;padding-left:20px}.ans li{margin:3px 0}
mark{background:#fff3ba;padding:0 2px;border-radius:3px}
.badge-halal{display:inline-block;background:#eaf7f0;color:var(--halal);border:1px solid #c7ebda;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.noresult{text-align:center;color:var(--muted);padding:30px;display:none}

  "transport": "<h2>Transportation &amp; Guide</h2><div class='custblk'><table class='ctbl'><thead><tr><th>Hari</th><th>Transport</th><th>Nota</th></tr></thead><tbody><tr><td class='it'>Day 1 &amp; Day 4</td><td>Private transport</td><td>Airport &#8646; hotel, asas 10 jam</td></tr><tr><td class='it'>Day 2</td><td>SIC joined long-tail boat</td><td>4-Islands Tour, sharing dengan pelancong lain</td></tr><tr><td class='it'>Day 3 &mdash; Basic</td><td>SIC speedboat</td><td>Hong Island</td></tr><tr><td class='it'>Day 3 &mdash; Standard / Honeymoon</td><td>SIC coach atau speedboat</td><td>Emerald Pool (darat) atau Phi Phi (speedboat)</td></tr><tr><td class='it'>Guide</td><td>Tour guide berbahasa Inggeris</td><td>Guide tempatan Krabi; tipping sudah termasuk</td></tr></tbody></table><p class='custnote'>Private transport asas 10 jam. Jam tambahan dikenakan caj dan dibayar tunai kepada pemandu. Trip SIC bermakna guide dan bot dikongsi &mdash; permintaan guide wanita tidak boleh dijamin.</p></div><div class='custblk'><h3>Anggaran masa perjalanan</h3><table class='ctbl'><thead><tr><th>Laluan</th><th>Masa</th></tr></thead><tbody><tr><td class='it'>Krabi Int. Airport &rarr; Krabi City</td><td>30 minit</td></tr><tr><td class='it'>Krabi City &rarr; Ao Nang / Railay Beach</td><td>30 minit</td></tr><tr><td class='it'>Krabi City &rarr; Emerald Pool</td><td>1 jam</td></tr><tr><td class='it'>Ao Nang &rarr; Ko Phi Phi</td><td>1 jam dengan speedboat</td></tr></tbody></table><p class='custnote'>Sumber: PT Krabi 4H3M Travel Map.</p></div>",
  "stay": "<h2>Accommodation</h2><p class='ssub'>Tiga malam di kawasan Aonang, sarapan included, 2&ndash;3 orang sebilik. Hotel dimuktamadkan sekurang-kurangnya 15 hari sebelum trip.</p><div class='custblk'><table class='ctbl'><thead><tr><th>Tier</th><th>Hotel (katalog)</th><th>Caj</th></tr></thead><tbody><tr><td class='it'>3&#9733; (default)</td><td>Aonang Silver Orchid Resort or similar &middot; Apasari Resort or similar</td><td>Termasuk dalam harga</td></tr><tr><td class='it'>4&#9733; (upgrade)</td><td>Krabi Cha-Da Resort or similar &middot; Krabi Heritage Hotel or similar</td><td class='add'>+RM250/pax &middot; Honeymoon +RM450/couple</td></tr><tr><td class='it'>Single supplement</td><td>Bilik seorang, mana-mana tier</td><td class='add'>+RM450/pax</td></tr></tbody></table></div>",
  "flight": "<h2>Flight &amp; Airport</h2><p class='ssub'>KUL &rarr; Krabi International Airport (KBV), direct lebih kurang 1 jam 20&ndash;30 minit. Pakej ground only &mdash; tiket tidak termasuk. Katalog minta pelanggan tiba di Krabi antara 1PM dan 3PM.</p><div class='custblk'><h3>Leg pergi &mdash; KUL &rarr; KBV</h3><table class='ctbl'><thead><tr><th>Airline</th><th>Flight</th><th>Berlepas KUL</th><th>Tiba KBV</th><th>Hari operasi</th><th>Anggaran return</th></tr></thead><tbody><tr><td class='it'>AirAsia</td><td>AK 868</td><td>1:40 PM</td><td>1:55 PM</td><td>Isnin &amp; Rabu tiada</td><td class='add'>RM 320 &ndash; RM 380</td></tr><tr><td class='it'>Firefly</td><td>FY 3610</td><td>11:30 AM</td><td>12:00 PM</td><td>Setiap hari</td><td class='add'>RM 360 &ndash; RM 400</td></tr></tbody></table><p class='custnote'>Sumber waktu &amp; anggaran harga: Flight Recommendation ARBA.</p></div><div class='custblk'><h3>Leg balik &mdash; KBV &rarr; KUL</h3><table class='ctbl'><thead><tr><th>Airline</th><th>Flight</th><th>Berlepas KBV</th><th>Tiba KUL</th><th>Hari operasi</th></tr></thead><tbody><tr><td class='it'>AirAsia</td><td>AK 869</td><td>2:25 PM</td><td>4:55 PM</td><td>Selasa, Khamis &ndash; Ahad sehingga 25 Okt 2026; setiap hari mulai 26 Okt 2026</td></tr><tr><td class='it'>AirAsia</td><td>AK 867</td><td>11:50 AM</td><td>2:10 PM</td><td>Pilihan awal &mdash; sahkan ketika booking</td></tr><tr><td class='it'>Firefly</td><td>FY 3611</td><td>1:00 PM</td><td>3:30 PM</td><td>Setiap hari</td></tr></tbody></table><p class='custnote'>Sumber leg balik: jadual penerbangan awam semasa (Ogos 2026) &mdash; tiada dalam katalog atau Flight Recommendation. Waktu tempatan; Thailand UTC+7, Malaysia UTC+8. Sahkan jadual dan harga semasa booking.</p></div><div class='custblk'><h3>Transfer lapangan terbang</h3><table class='ctbl'><thead><tr><th>Hari</th><th>Transfer</th></tr></thead><tbody><tr><td class='it'>Day 1</td><td>Airport pickup KBV &rarr; hotel Aonang (private transport)</td></tr><tr><td class='it'>Day 4</td><td>Hotel &rarr; KBV selepas check-out (private transport)</td></tr></tbody></table><p class='custnote'>Krabi International Airport ada surau untuk penumpang Muslim. Sahkan dengan staf ARBA sebelum menempah mana-mana connecting flight domestik.</p></div>",
  "freegift": "<h2>Free Gift (Promo)</h2><details class='qa'><summary><span class='tw'>&#9654;</span><span>Free Gift untuk campaign atau Promo?</span></summary><div class='ans'><p><strong>Krabi:</strong> Upgrade to 7 Islands + Sunset BBQ + Plankton<span class='gchip'>Kod: FKBV2</span> (All pax)</p><p><strong>Bullet:</strong> BRB Luggage Tag / Pocket Wifi 4G (per booking)</p><p class='gnote'>*Bullet wajib tanya PO/Leader</p><p class='gnote'><strong>Disclaimer:</strong> Sila sahkan dengan PO jika di luar waktu Promo.</p></div></details>",

 "snapshot": "# PT Krabi — Knowledge Base (Important Notes · FAQ)\n\n## 1. IMPORTANT NOTES (Polisi Pakej)\n\n*3 varian: **Basic** (RM1,297/pax — 4-Islands + Hong Island), **Standard** (RM1,497/pax — 4-Islands + Emerald Pool atau Phi Phi), **Honeymoon** (RM2,897/couple — Standard + candlelight dinner, bouquet, hiasan bilik, dinner included). Semua 4D3N, ground only, 3★ Aonang, kadar katalog untuk 2–10 pax.*\n\n- Harga katalog: Basic RM1,297/pax · Standard RM1,497/pax · Honeymoon RM2,897/couple.\n- Kadar kanak-kanak katalog — Basic: CWB RM1,097, CNB RM997. Standard: CWB RM1,297, CNB RM1,097. Infant (<3 thn) FOC. Umur: Adult ≥12, CWB 3–11, CNB 3–7.\n- Tier 2 (harga jual group, sumber PT Krabi R&D — tiada dalam katalog): Basic RM1,097 · Standard RM1,297 untuk dewasa sahaja.\n- Pakej **ground-only** — tiket penerbangan tidak termasuk (ARBA boleh uruskan).\n- Meals: **halfboard** (3B + 2L); dinner own expense kecuali **Honeymoon** (fullboard).\n- Basic Day 3 = Hong Island; **tiada** pilihan Emerald/Phi Phi. Standard/Honeymoon Day 3 = Emerald Pool (default) atau Phi Phi (+RM100/pax).\n- Deposit **RM250/pax**; full payment **45 hari** sebelum berlepas. Late booking <45 hari +RM50/booking.\n- Itinerari & hotel difinalkan **15 hari** sebelum trip. Harga sah **24 jam**. Pakej sah travel hingga **31 Dec 2026**.\n- Peak season 2026: 11 Jan–30 Apr +RM250/pax; 1 Nov–31 Dis +RM300/pax. Mei–Jun tiada surcharge. Travel 2027: 1 Nov 2026–9 Jan 2027 dan 10 Jan–30 Apr 2027 +RM300/pax; tarikh 2027 lain by request.\n- Upgrade 4★: Basic & Standard +RM250/pax; Honeymoon +RM450/couple. Single Supplement +RM450/pax. Private transport 10 jam basis (extra hour cash to driver).\n- Passport sah minimum **6 bulan**; Malaysia **visa-free 30 hari** (isi TDAC sebelum tiba).\n- Island hopping tidak digalakkan untuk warga emas / wanita mengandung — bot mencabar. Musim terbaik **Nov–Apr**.\n- Muslim-friendly (halal, surau/masjid) baseline — Krabi komuniti Muslim besar, halal mudah di Aonang. Awas monyet di Phra Nang Cave & pantai.\n\n## 3. FAQ\n\n### A. Pakej & Itinerari\n\n**Apa yang best di Krabi?**\nKrabi destinasi mesra Muslim — mudah cari makanan halal & masjid. Terkenal dengan alam & jungle: tebing batu kapur, lagun tersembunyi, emerald pool dan island hopping long-tail boat. Bandar kecil santai berbanding Phuket.\n\n**Beza Basic, Standard dan Honeymoon?**\nBasic (RM1,297/pax): 4-Islands + Hong Island. Standard (RM1,497/pax): 4-Islands + Day 3 pilihan Emerald Pool atau Phi Phi (+RM100/pax). Honeymoon (RM2,897/couple): sama seperti Standard + candlelight dinner, sejambak bunga, hiasan bilik & dinner included.\n\n**Tempat mana akan dilawat?**\nRailay Beach, Phranang Cave, Poda/Tub/Mor/Chicken Island, Sail Rock, Hong Island (Basic), Emerald Pool + Klongthom Hot Spring + Tiger Cave Temple (Standard pilihan A), Phi Phi/Maya Bay (Standard pilihan B), Black Crab Statue & Local Market (city tour).\n\n**Ada aktiviti snorkeling?**\nYa — island hopping & snorkeling aktiviti utama Day 2 (4-Islands) dan Day 3 (Hong Island / Phi Phi). Air laut jernih, boleh lihat terumbu karang.\n\n**Boleh request guide perempuan?**\nTidak boleh. Trip Krabi adalah SIC (sharing basis) — guide bergantung pada bot dan waktu tour.\n\n**Pakej termasuk tiket flight?**\nBelum. Private ground-only. Book sendiri (AirAsia AK868 / Firefly FY3610) atau minta ARBA belikan.\n\n**Boleh customize itinerari?**\nBoleh — Private Tour fleksibel. Add-on katalog: Phi Phi Day 3 (+RM100/pax), upgrade Day 2 ke 7-Islands + Plankton (+RM80/pax), kayaking Hong Island (RM70 dewasa / RM50 kanak-kanak).\n\n**Berapa lama transport tiap hari?**\nPrivate transport 10 jam basis (D1 & D4). Extra hour dikenakan cash to driver.\n\n### B. Halal, Makanan & Solat\n\n**Senang dapat makanan halal di Krabi?**\nSangat mudah, terutama Aonang — komuniti Muslim besar, banyak restoran Thai-Muslim, seafood halal & gerai berhampiran masjid (Jame Food Centre, Madina).\n\n**Macam mana ARBA pastikan halal?**\nTeam ARBA pergi ke Krabi untuk pastikan operator pilih restoran yang menepati kriteria halal / Muslim-friendly.\n\n**Ada masjid / surau untuk solat?**\nYa — Masjid Nurul Islam / Ao Nang Mosque untuk solat harian & Jumaat. Krabi International Airport ada surau. Di pulau tiada surau — solat jamak-qasar di hotel.\n\n**Boleh solat masa island tour?**\nBot dan jadual dikongsi (SIC), jadi tiada perhentian khas untuk solat. Amalan biasa: jamak-qasar Zohor & Asar di hotel selepas tour, atau qasar sebelum bertolak.\n\n**Akan makan apa?**\nHalfboard: 3 sarapan + 2 makan tengahari (dinner perbelanjaan sendiri). Honeymoon: 3 sarapan + 2 makan tengahari + dinner (halal). Lunch island tour sharing buffet.\n\n### C. Visa & Passport\n\n**Perlu visa ke Thailand?**\nTidak. Rakyat Malaysia visa-exempt 30 hari. Perlu bukti perjalanan pulang.\n\n**Perlu isi apa-apa sebelum masuk?**\nYa — Thailand Digital Arrival Card (TDAC) dalam talian sebelum tiba.\n\n**Passport sah berapa lama?**\nMinimum 6 bulan dari tarikh berlepas.\n\n### D. Flight & Airport\n\n**Berapa lama flight KL–Krabi?**\nDirect lebih kurang 1 jam 20–30 minit ke Krabi International Airport (KBV).\n\n**Flight pergi apa?**\nAK 868 berlepas KUL 1:40 PM tiba KBV 1:55 PM (Isnin & Rabu tiada); FY 3610 berlepas KUL 11:30 AM tiba KBV 12:00 PM (setiap hari). Katalog minta pelanggan tiba antara 1PM–3PM.\n\n**Flight balik apa?**\nAK 869 berlepas KBV 2:25 PM tiba KUL 4:55 PM (Selasa, Khamis–Ahad sehingga 25 Okt 2026; setiap hari mulai 26 Okt 2026); FY 3611 berlepas KBV 1:00 PM tiba KUL 3:30 PM (setiap hari); AK 867 berlepas KBV 11:50 AM tiba KUL 2:10 PM.\n\n**Anggaran harga tiket?**\nAK868/869 RM320–380 dan FY3610/3611 RM360–400 pergi-balik. Harga berubah — sahkan semasa booking.\n\n**Transfer dari airport macam mana?**\nPrivate transport disediakan Day 1 & Day 4 (airport ⇄ hotel).\n\n### E. Hotel & Bilik\n\n**Hotel apa digunakan?**\n3★ Aonang: Aonang Silver Orchid Resort atau Apasari Resort (or similar), kawasan pelancong Aonang, sarapan included.\n\n**Bilik ada balcony?**\nBergantung pada hotel. Aonang Silver Orchid Resort ada balcony.\n\n**Boleh upgrade hotel?**\nBoleh — katalog: 4★ Krabi Cha-Da Resort atau Krabi Heritage Hotel, +RM250/pax (Honeymoon +RM450/couple). Pilihan 4★ lain (Blue Tara, Aonang Buri, AVA Sea, Ananta Burin, Bluesotel) dan 4★+ Aonang Princeville adalah dari PT Krabi R&D — tiada dalam katalog, sebut harga.\n\n**Berapa orang sebilik?**\n2–3 orang sebilik. Single occupancy +RM450/pax.\n\n**Sesuai honeymoon?**\nYa — varian Honeymoon RM2,897/couple ada candlelight dinner Day 1, sejambak bunga, hiasan bilik honeymoon dan dinner included.\n\n**Honeymoon tambah candle light dinner berapa?**\nHotel 3★: tambah RM120/pax.\n\n### F. Cuaca & Musim\n\n**Bila waktu terbaik?**\nNovember–April (musim kering) — laut tenang, cuaca cerah, sesuai island hopping. Suhu 22–32°C.\n\n**Macam mana Mei–Oktober?**\nMusim hujan (monsoon) — hujan lebat & ribut petir boleh jejas aktiviti laut. Kelebihan: harga lebih murah, kurang orang.\n\n**Kalau aktiviti pulau cancel sebab hujan?**\nAmalan biasa: tiada refund. Driver-guide adjust itinerari (cth city tour). Sahkan dengan operator.\n\n### G. Shopping & Duit\n\n**Mata wang apa?**\nThai Baht (THB). Kad OK di hotel & restoran besar; tunai THB perlu untuk pasar, kedai kecil & add-on on-site.\n\n**Cash poket berapa?**\nCadangan RM500–1,500 per orang bergantung tabiat membeli-belah & optional activities.\n\n### H. Payment & Refund\n\n**Deposit berapa?**\nRM250/pax. Baki full payment 45 hari sebelum berlepas.\n\n**Bila itinerari difinalkan?**\n15 hari sebelum trip. Harga quotation sah 24 jam. Pakej sah travel hingga 31 Dec 2026.\n\n**Late booking ada surcharge?**\nYa — <45 hari sebelum berlepas +RM50/booking.\n\n### I. Add-ons & Customization\n\n**Apa boleh tambah?**\nKatalog: Phi Phi Day 3 (+RM100/pax), upgrade Day 2 ke 7-Islands + Plankton (+RM80/pax), kayaking Hong Island (RM70/50). Add-on ARBA: 7-Islands full (RM250/pax), Pocket WiFi (RM80/120), takaful TripCare 360 dari RM64/pax, luggage tracker RM20–70, malam & meal tambahan.\n\n**Free gift promo?**\nKrabi: Upgrade to 7 Islands + Sunset BBQ + Plankton, kod FKBV2, All pax. Bullet (BRB Luggage Tag / Pocket WiFi 4G, per booking) — wajib tanya PO/Leader; sahkan dengan PO jika di luar waktu Promo.\n\n### J. Kesihatan & Keselamatan\n\n**Island hopping sesuai untuk semua?**\nSesuai untuk kebanyakan orang, TAPI tidak digalakkan untuk warga emas, wanita mengandung atau yang ada masalah kesihatan — perjalanan bot mencabar. Pakai life jacket.\n\n**Awas apa-apa?**\nMonyet di Phra Nang Cave & pantai — jangan tunjuk makanan, tutup beg. Ambil takaful perjalanan (aktiviti laut ada risiko).\n\n### K. Praktikal (SIM / Socket / Toilet)\n\n**Internet macam mana?**\nPocket WiFi RoamingMan (3GB 4G RM80 / 10GB 5G RM120 untuk 4D3N) atau roaming/eSIM sendiri. Liputan baik di Aonang & Krabi Town.\n\n**Socket & plug?**\nThailand Type A/B/C, 220V. Bawa universal adapter.\n\n### L. Packing\n\n**Apa perlu bawa?**\nBaju ringan cepat kering, swimwear muslim-friendly, sunblock, topi, kasut air, telekung/sejadah ringkas, bekal snek halal, dan cash THB.\n"

const unescapeMd=t=>t.replace(/\\([#\-*>|&<~.\\`_])/g,"$1");
function inline(t){t=esc(t);t=t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");t=t.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g,"<em>$1</em>");return t;}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const HALAL_RE=/\bhalal|surau|solat|qiblat|masjid|mosque|wudu|sejadah|telekung|arak|syariah\b/i;
const W=(img)=> !img?"" : (/^https?:/i.test(img)?img : "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(img)+"?width=800");

$("#brandTag").textContent=KB.meta.brandTag;
$("#kicker").textContent=KB.meta.kicker;
$("#heroTitle").textContent=KB.meta.heroTitle;
$("#heroLead").textContent=KB.meta.heroLead;

$("#q2").placeholder=KB.meta.miniSearchPlaceholder;

$("#statustxt").textContent=KB.meta.statusText;
$("#footer").innerHTML=KB.meta.footerHtml;
if(KB.meta.heroImage){const hi=$("#heroImg");hi.src=/^(https?|data):/i.test(KB.meta.heroImage)?KB.meta.heroImage:"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(KB.meta.heroImage)+"?width=1600";hi.onerror=function(){this.style.display="none";};}else{$("#heroImg").style.display="none";}

  if(m.expect&&m.expect.length){html+='<h5 style="margin-top:12px">What to Expect</h5><ul class="expect">'+m.expect.map(x=>"<li>"+esc(x)+"</li>").join("")+'</ul>';}

/* --- cards --- */
function heart(){return "<button class='heart' title='Simpan' onclick='event.preventDefault();event.stopPropagation();this.classList.toggle(\"on\");this.textContent=this.classList.contains(\"on\")?\"♥\":\"♡\"'>♡</button>";}
$("#pkgRow").innerHTML=KB.packages.map((p,i)=>`<button class="tcard" onclick="showPackage(${i})"><div class="im"><span class="emoji">${p.emoji||"📦"}</span>${p.img?`<img src="${W(p.img)}" alt="${esc(p.n)}">`:""}<span class="chip">${esc(p.tag)}</span>${heart()}</div><div class="body"><b>${esc(p.n)}</b><p>${esc(p.sub||"")}</p><span class="cta">Lihat butiran →</span></div></button>`).join("");
$("#gallery").innerHTML=KB.attractions.map((a,i)=>`<button class="tcard" onclick="showAttraction(${i})"><div class="im"><span class="emoji">${a.emoji||"📍"}</span>${a.img?`<img src="${W(a.img)}" alt="${esc(a.n)}">`:""}<span class="chip">${esc(a.t)}</span>${heart()}</div><div class="body"><b>${esc(a.n)}</b><p>${esc(a.short||"")}</p><span class="cta">Lihat butiran →</span></div></button>`).join("");
document.querySelectorAll(".tcard img").forEach(im=>im.onerror=function(){this.style.display="none";});

function renderItin(i){const rows=KB.itineraries[i];if(!rows)return"";
  let out='<div class="itin"><h3>Itinerari Ringkas (Day-to-Day)</h3>';
  out+=rows.map(r=>`<div class="itday"><div class="itd"><small>DAY</small><b>${r.d}</b></div><div class="itc"><p class="itt">${esc(r.t)} ${r.m?`<span class="rtag">${esc(r.m)}</span>`:""}</p><ul>${r.a.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div></div>`).join("");
  out+='</div>';return out;}

  document.querySelectorAll(".explore").forEach(e=>e.classList.add("hidden"));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.add("hidden"));

  const v=$("#attractionview");

    <div class="adhero"><img src="${a.img?W(a.img):''}" alt="${esc(a.n)}" onerror="this.style.display='none'"><div class="adscrim"></div><div class="adtitle"><span class="chip">${esc(a.t)}</span><h1>${esc(a.n)}</h1></div></div>
    <div class="adbody"><p class="adlead">${esc(a.intro)}</p>
      <h3>Tarikan utama</h3><ul>${(a.hi||[]).map(x=>"<li>"+esc(x)+"</li>").join("")}</ul>
      <p><b>Masa terbaik:</b> ${esc(a.best||"")}</p>

function closeAttraction(){const v=$("#attractionview");v.classList.add("hidden");v.innerHTML="";$("#topicbar").classList.remove("hidden");showTopic("all");}
function showPackage(i){const p=KB.packages[i];if(!p)return;
  $("#q").value="";$("#q2").value="";
  document.querySelectorAll(".explore").forEach(e=>e.classList.add("hidden"));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.add("hidden"));
  $("#topicbar").classList.add("hidden");$("#noresult").style.display="none";
  const v=$("#attractionview");
  v.innerHTML=`<button class="backbtn" onclick="closeAttraction()">← Kembali ke Overview</button>
    <div class="adhero"><img src="${p.img?W(p.img):''}" alt="${esc(p.n)}" onerror="this.style.display='none'"><div class="adscrim"></div><div class="adtitle"><span class="chip">${esc(p.tag)}</span><h1>${esc(p.n)}</h1></div></div>
    <div class="adbody"><p class="adlead">${esc(p.intro)}</p>
      ${p.note?`<div class="pkgnote"><b>Nota:</b> ${esc(p.note)}</div>`:""}
      ${renderItin(i)}
      <div class="incexc"><div class="incbox"><h3>Termasuk</h3><ul>${(p.inc||[]).map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div><div class="excbox"><h3>Tidak termasuk</h3><ul>${(p.exc||[]).map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div></div>
      <p class="pkgfoot">Rujuk tab <b>Harga & Pakej</b> untuk kadar katalog & surcharge.</p>
    </div>`;
  v.classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"});
}

/* --- markdown engine --- */
function renderBody(lines){let html="",i=0;while(i<lines.length){let ln=lines[i];
  if(/^\s*\|.*\|\s*$/.test(ln)){const t=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){t.push(lines[i]);i++;}html+=renderTable(t);continue;}
  if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it.push(lines[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
  if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}return html;}
function renderTable(rows){rows=rows.filter(r=>!/^\s*\|[\s\-|:]+\|\s*$/.test(r));const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());if(!rows.length)return"";
  let h="<table class='kb'><thead><tr>"+cells(rows[0]).map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>";
  for(let r=1;r<rows.length;r++)h+="<tr>"+cells(rows[r]).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";return h+"</tbody></table>";}
function parse(md){const lines=unescapeMd(md).split(/\r?\n/);const secs=[];let cur=null,subs=null,i=0;
  while(i<lines.length){const ln=lines[i];
    if(/^##\s+/.test(ln)){const title=ln.replace(/^##\s+/,"").trim();cur={title,id:slug(title),type:/FAQ/i.test(title)?"faq":"info",intro:[],cats:[]};secs.push(cur);subs=null;i++;continue;}
    if(cur){
      if(cur.type==="faq"&&/^###\s+/.test(ln)){subs={title:ln.replace(/^###\s+/,"").trim(),qas:[]};subs.id=slug(subs.title);cur.cats.push(subs);i++;continue;}
      if(cur.type==="faq"&&subs){const m=ln.match(/^\*\*(.+?)\*\*\s*$/);
        if(m){const q=m[1];const body=[];i++;while(i<lines.length&&!/^\*\*(.+?)\*\*\s*$/.test(lines[i])&&!/^###\s+/.test(lines[i])&&!/^##\s+/.test(lines[i])){body.push(lines[i]);i++;}subs.qas.push({q,body});continue;}
        i++;continue;}
      cur.intro.push(ln);i++;continue;}
    i++;}
  return secs;}

/* topics: fixed order. blocks (pricing/custom/surcharge/transport/stay) come from KB.blocks */
const TOPICS=[
 {id:"compare",t:"Perbezaan Pakej"},
 {id:"itin",t:"Itinerary & Aktiviti"},{id:"map",t:"Travel Map"},
 {id:"pricing",t:"Harga & Pakej"},{id:"custom",t:"Simple Customisation"},
 {id:"surcharge",t:"Surcharge"},{id:"transport",t:"Transportation & Guide"},{id:"stay",t:"Accommodation"},
 {id:"food",t:"Halal & Makanan"},{id:"prayer",t:"Solat"},{id:"flight",t:"Flight & Airport"},
 {id:"weather",t:"Cuaca & Musim"},{id:"tips",t:"Shopping & Tips"},{id:"visa",t:"Visa & Passport"},
 {id:"freegift",t:"Free Gift (Promo)"},
 {id:"polisi",t:"Polisi & Payment"},
];
const CATMAP={a:"itin",i:"custom",e:"stay",d:"flight",f:"weather",g:"tips",j:"tips",k:"tips",l:"tips",c:"visa",h:"polisi"};
const PRAYER_RE=/solat|masjid|surau|qiblat|subuh|sembahyang|telekung|sejadah/i;
function topicOf(letter,q,body){letter=(letter||"").toLowerCase();
  if(letter==="b")return PRAYER_RE.test((q||"")+" "+(body||[]).join(" "))?"prayer":"food";
  return CATMAP[letter]||"itin";}
function infoHtml(s){
  const body=s.intro.slice();let sub=null;
  for(let k=0;k<body.length;k++){if(/^\*[^*].*\*$/.test(body[k].trim())){sub=body[k].trim().replace(/^\*|\*$/g,"");body.splice(k,1);break;}}
  let html=sub?"<div class='subtitle'>"+esc(sub)+"</div>":"";let i=0;
  while(i<body.length){let ln=body[i];
    if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<body.length&&/^\s*[-*]\s+/.test(body[i])){it.push(body[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul class='klist'>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
    if(/^\s*\|.*\|\s*$/.test(ln)){let t=[];while(i<body.length&&/^\s*\|.*\|\s*$/.test(body[i])){t.push(body[i]);i++;}html+=renderTable(t);continue;}
    if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}
  return html;}
let CURRENT="all";

function renderHotels(){
  if(!KB.hotels||!KB.hotels.length)return"";
  return '<div class="hotels">'+KB.hotels.map(ht=>`<div class="hcard">${ht.img?`<div class="ph" style="height:auto;aspect-ratio:1/1"><img src="${W(ht.img)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.style.display='none'"></div>`:""}<div class="hb"><div class="tier">${esc(ht.tier)}</div><div class="hn">${esc(ht.name)}</div><div class="hnote">${esc(ht.note||"")}</div></div></div>`).join("")+'</div>';
}
function renderActs(){
  if(!KB.actGroups||!KB.actGroups.length)return"";
  return KB.actGroups.map(g=>'<h3 class="actcity">'+esc(g.city)+'</h3><div class="actgrid">'+g.items.map(function(it){var n=(it&&typeof it==="object")?it.n:it;var im=(it&&typeof it==="object")?it.img:"";var ph=im?'<img src="'+W(im)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=String.fromCharCode(128205)">':String.fromCharCode(128205);return '<div class="actcard"><div class="actim">'+ph+'</div><div class="actname">'+esc(n)+'</div></div>';}).join('')+'</div>').join('');
}

function build(md){
  const secs=parse(md);const cont=$("#content");cont.innerHTML="";
  const info={},qs={};TOPICS.forEach(t=>qs[t.id]=[]);
  secs.forEach(s=>{
    if(s.type==="info"){info["polisi"]=(info["polisi"]||"")+"<div class='infosub'>"+esc(s.title.replace(/^\d+\.\s*/,""))+"</div>"+infoHtml(s);}
    else{s.cats.forEach(cat=>{const letter=(cat.title.match(/^([A-Z])\./)||[])[1];cat.qas.forEach(qa=>{qs[topicOf(letter,qa.q,qa.body)].push(qa);});});}
  });
  TOPICS.forEach(tp=>{
    if(!qs[tp.id].length && !info[tp.id])return;
    const sec=document.createElement("section");sec.className="block hidden";sec.dataset.topic=tp.id;sec.id="topic-"+tp.id;
    sec.innerHTML="<h2>"+esc(tp.t)+"</h2>"+(info[tp.id]||"");
    qs[tp.id].forEach(qa=>{const halal=HALAL_RE.test(qa.q+" "+qa.body.join(" "));
      const d=document.createElement("details");d.className="qa";d.dataset.text=(qa.q+" "+qa.body.join(" ")).toLowerCase();
      d.innerHTML="<summary><span class='tw'>▶</span><span>"+inline(qa.q)+(halal?"<span class='badge-halal'>halal/solat</span>":"")+"</span></summary><div class='ans'>"+renderBody(qa.body)+"</div>";
      sec.appendChild(d);});
    cont.appendChild(sec);
  });
  const B=KB.blocks||{};
  TOPICS.map(function(t){return [t.id,B[t.id]];}).forEach(function(b){
    if(!b[1])return;
    const existing=document.querySelector('.block[data-topic="'+b[0]+'"]');
    if(existing){
      const inner=b[1].replace(/^\s*<h2>[\s\S]*?<\/h2>/,"");
      const hh=existing.querySelector("h2");
      if(hh)hh.insertAdjacentHTML("afterend",inner); else existing.insertAdjacentHTML("afterbegin",inner);
    }
    else{const s=document.createElement("section");s.className="block hidden";s.dataset.topic=b[0];s.id="topic-"+b[0];s.innerHTML=b[1];cont.appendChild(s);}
  });
  var _stay=document.querySelector('.block[data-topic="stay"]');
  if(_stay){var _hh=renderHotels();var _fq=_stay.querySelector("details.qa");
  if(_fq)_fq.insertAdjacentHTML("beforebegin",_hh); else _stay.insertAdjacentHTML("beforeend",_hh);}
  var _itin=document.querySelector('.block[data-topic="itin"]');
  var _acts=renderActs();
  if(_itin&&_acts){var _h2=_itin.querySelector("h2");
  if(_h2)_h2.insertAdjacentHTML("afterend",'<p class="ssub" style="margin:8px 0 6px">Highlight aktiviti ikut kawasan</p>'+_acts);}
  renderTabs();
  if(($("#q").value||"").trim())applyFilter();else showTopic(CURRENT);
}
function renderTabs(){
  const list=[{id:"all",t:"Overview"}].concat(TOPICS.filter(t=>document.querySelector('.block[data-topic="'+t.id+'"]')));
  $("#topicbar").innerHTML=list.map(t=>`<button class="tab${t.id===CURRENT?' active':''}" data-id="${t.id}" onclick="showTopic('${t.id}')">${esc(t.t)}</button>`).join("");
}
function showTopic(id){CURRENT=id;$("#q").value="";$("#q2").value="";
  document.querySelectorAll(".explore .tcard").forEach(c=>c.style.display="");
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  const all=id==="all";
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  document.querySelectorAll(".explore").forEach(e=>e.classList.toggle("hidden",!all));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.toggle("hidden",all||b.dataset.topic!==id));
  document.querySelectorAll("details.qa").forEach(d=>{d.classList.remove("hidden");d.open=false;});
  $("#noresult").style.display="none";
  if(all)window.scrollTo({top:0,behavior:"smooth"});
  else{const el=document.querySelector('.block[data-topic="'+id+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
}
function applyFilter(){
  const q=($("#q").value||"").trim().toLowerCase();
  if(!q){showTopic(CURRENT);return;}
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.remove("active"));
  let any=false;
  document.querySelectorAll("details.qa").forEach(d=>{const show=d.dataset.text.includes(q);d.classList.toggle("hidden",!show);d.open=show;if(show)any=true;});
  document.querySelectorAll("#content .block").forEach(b=>{
    const hasQA=!!b.querySelector("details.qa");
    const qaMatch=hasQA && b.querySelectorAll("details.qa:not(.hidden)").length>0;
    const textMatch=(b.textContent||"").toLowerCase().includes(q);
    const show=hasQA?(qaMatch||textMatch):textMatch;
    b.classList.toggle("hidden",!show); if(show)any=true;
  });
  document.querySelectorAll(".explore").forEach(sec=>{
    let secAny=false;
    sec.querySelectorAll(".tcard").forEach(c=>{const mm=(c.textContent||"").toLowerCase().includes(q);c.style.display=mm?"":"none";if(mm)secAny=true;});
    sec.classList.toggle("hidden",!secAny); if(secAny)any=true;
  });
  $("#noresult").style.display=any?"none":"block";
}
function sync(from,to){to.value=from.value;applyFilter();}
$("#q").addEventListener("input",()=>sync($("#q"),$("#q2")));
$("#q2").addEventListener("input",()=>sync($("#q2"),$("#q")));
$("#goBtn").addEventListener("click",()=>{applyFilter();});
build(KB.snapshot);
</script>
</body>
</html>
